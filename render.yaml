# Render blueprint for the API. Connecting the repo is the only manual step.
#
# The API and the frontend have to know each other's names: VITE_API_BASE on
# Vercel points at this service, and ALLOWED_ORIGINS below points back. Change
# the origin list HERE rather than in the Render dashboard — the value is
# literal in this file, so a blueprint sync overwrites whatever the dashboard
# says and CORS breaks again with nothing in the diff to explain it.
services:
  - type: web
    name: sundai-cgm-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/meta
    envVars:
      # Comma-separated, exact origins — scheme and host, no trailing slash and
      # no path, because CORS matches the Origin header literally.
      #
      # Only the production Vercel domain is listed. Preview deploys get a fresh
      # hostname every time, so a preview will fail CORS against this API; that
      # is the honest default rather than opening the origin list to a wildcard
      # on a service that answers questions about people's bloodwork.
      - key: ALLOWED_ORIGINS
        value: http://localhost:5173,http://127.0.0.1:5173,https://sundai-cgm.vercel.app

# Not declared above, but load-bearing: Render sets RENDER_GIT_COMMIT on every
# service automatically, and serve.py reports it as model_version. Declaring it
# here would turn an automatic value into one the blueprint prompts for.
# .dockerignore keeps .git out of the image, so it is the only way in.

# Deliberately absent: ANTHROPIC_API_KEY. The explanation endpoint narrates from
# its deterministic template here, which is a supported path rather than a
# degraded one. `anthropic` is not in requirements.txt, so the SDK is not in the
# image and explain.available() is False no matter what key is set - an env var
# that reads like a live-explanation switch and silently does nothing is worse
# than not offering one. Add the dependency first if you want the live path.
