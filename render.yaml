# Render blueprint for the API. Connecting the repo is the only manual step.
#
# After the first deploy, set VITE_API_BASE on Vercel to this service's URL and
# add that Vercel URL to ALLOWED_ORIGINS below — the two have to know each other.
services:
  - type: web
    name: sundai-cgm-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/meta
    envVars:
      # Comma-separated. Add the deployed frontend origin once Vercel gives you one.
      - key: ALLOWED_ORIGINS
        value: http://localhost:5173,http://127.0.0.1:5173

# Not declared above, but load-bearing: Render sets RENDER_GIT_COMMIT on every
# service automatically, and serve.py reports it as model_version. Declaring it
# here would turn an automatic value into one the blueprint prompts for.
# .dockerignore keeps .git out of the image, so it is the only way in.

# Deliberately absent: ANTHROPIC_API_KEY. The explanation endpoint narrates from
# its deterministic template here, which is a supported path rather than a
# degraded one. `anthropic` is not in requirements.txt, so the SDK is not in the
# image and explain.available() is False no matter what key is set - an env var
# that reads like a live-explanation switch and silently does nothing is worse
# than not offering one. Add the dependency first if you want the live path.
