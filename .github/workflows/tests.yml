name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CGM_CACHE: ${{ github.workspace }}/.cgm_cache

jobs:
  # Warm the data cache once, so the matrix does not pull the parquet files
  # from the organizers' bucket five times over.
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        id: cache
        with:
          path: ${{ env.CGM_CACHE }}
          key: cgm-data-v1
      - name: Fetch the nine parquet tables
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install --quiet -r requirements.txt
          python -c "import cgm; [cgm._fetch(f'{t}.parquet') for t in cgm.TABLES]"
          du -sh "$CGM_CACHE"

  test:
    needs: data
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is excluded on purpose: xgboost>=3.1 requires 3.10+, and older
        # xgboost mis-reads the saved model. See requirements.txt.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ${{ env.CGM_CACHE }}
          key: cgm-data-v1
      - run: python -m pip install --quiet -r requirements.txt
      - name: Run the repair tests
        run: python test_cgm.py
      - name: Run the serving round-trip test
        run: python test_predict.py
      - name: Run the rung-5 / recommender / personalisation tests
        run: python test_rung5.py
      - name: Check the installable package works with no heavy deps
        run: |
          python -m pip install --quiet .
          cd /tmp && python -c "from sundai_cgm import value_of_information as v; r=v({}, 104); assert r['score']==1.0, r; assert r['recommended_tier']=='core', r; print('package OK:', r['recommended_panel'])"
      - name: Validate the API contract, stub and real backend
        run: |
          python -m pip install --quiet fastapi httpx jsonschema
          python test_contract.py --real

  # The floor in requirements.txt is a claim; this checks it is true.
  oldest-deps:
    needs: data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/cache@v4
        with:
          path: ${{ env.CGM_CACHE }}
          key: cgm-data-v1
      - run: python -m pip install --quiet "pandas==2.2.*" "pyarrow==14.*" "numpy==1.26.*" "scikit-learn==1.3.*" "xgboost==3.1.*"
      - run: python test_cgm.py
      - run: python test_predict.py

  # The gap that let schema.d.ts go stale when the contract changed. CI should
  # catch that, not a person noticing.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Types must match the committed contract
        run: npm run check:api
      - run: npm run typecheck
      - run: npm run build
